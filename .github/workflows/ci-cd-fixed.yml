# ==========================================================
# TicketCharge Hub - GitHub Actions CI/CD (FIXED)
# Trigger: main branch pe push hone par
# ==========================================================

name: TicketCharge Hub CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  DOCKER_REPO: devkaran06/event
  FRONTEND_TAG: frontend
  BACKEND_TAG: backend

jobs:

  # --------------------------------------------------------
  # Job 1: Frontend Build + Test
  # --------------------------------------------------------
  frontend-build:
    name: 🏗️ Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Frontend Dependencies
        run: npm install --legacy-peer-deps

      - name: 🏗️ Build React App
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_RAZORPAY_KEY_ID: ${{ secrets.VITE_RAZORPAY_KEY_ID }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: ✅ Show dist/ size
        run: du -sh dist/ || echo "dist not found"

      - name: 📤 Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1

  # --------------------------------------------------------
  # Job 2: Backend Check
  # --------------------------------------------------------
  backend-check:
    name: 🔍 Backend Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Backend Dependencies
        run: |
          cd backend
          npm install --omit=dev

      - name: ✅ Backend check complete
        run: echo "Backend dependencies install successful"

  # --------------------------------------------------------
  # Job 3: Docker Build & Push (only if secrets exist)
  # --------------------------------------------------------
  docker-build-push:
    name: 🐳 Docker Build & Push
    runs-on: ubuntu-latest
    needs: [frontend-build, backend-check]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Frontend Deps (for Docker build)
        run: npm install --legacy-peer-deps

      # Check if secrets exist
      - name: 🔍 Check Docker Credentials
        id: check_secrets
        run: |
          if [ -z "${{ secrets.DOCKER_HUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKER_HUB_TOKEN }}" ]; then
            echo "Docker credentials not configured"
            echo "has_credentials=false" >> $GITHUB_OUTPUT
          else
            echo "Docker credentials found"
            echo "has_credentials=true" >> $GITHUB_OUTPUT
          fi

      # Only login if credentials exist
      - name: 🔑 Login to Docker Hub
        if: steps.check_secrets.outputs.has_credentials == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: ⚙️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build but don't push if no credentials
      - name: 🏗️ Build & Push Frontend Image
        if: steps.check_secrets.outputs.has_credentials == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REPO }}:${{ env.FRONTEND_TAG }}
            ${{ env.DOCKER_REPO }}:${{ env.FRONTEND_TAG }}-${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🏗️ Build & Push Backend Image
        if: steps.check_secrets.outputs.has_credentials == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REPO }}:${{ env.BACKEND_TAG }}
            ${{ env.DOCKER_REPO }}:${{ env.BACKEND_TAG }}-${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🏗️ Build Frontend (No Push)
        if: steps.check_secrets.outputs.has_credentials == 'false'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🏗️ Build Backend (No Push)
        if: steps.check_secrets.outputs.has_credentials == 'false'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: ✅ Build Status
        run: |
          if [ "${{ steps.check_secrets.outputs.has_credentials }}" = "true" ]; then
            echo "✅ Docker Push Complete"
            echo "Frontend: ${{ env.DOCKER_REPO }}:${{ env.FRONTEND_TAG }}"
            echo "Backend:  ${{ env.DOCKER_REPO }}:${{ env.BACKEND_TAG }}"
          else
            echo "⚠️ Docker credentials not configured"
            echo "Images built but not pushed"
            echo "To enable push, add these secrets to GitHub:"
            echo "  - DOCKER_HUB_USERNAME"
            echo "  - DOCKER_HUB_TOKEN"
          fi
